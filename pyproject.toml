[project]
name = "demo-databricks-mdp"
version = "0.1.0"
description = "Databricks demo platform: ingestion, modeling, Genie, ML, GenAI, and Apps"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/common", "tests/cicd"]
pythonpath = ["src", "cicd"]
