resources:
  jobs:
    pattern_verify_lakeflow_query_postgresql:
      name: verify--pattern--lakeflow--query--postgresql--${bundle.target}
      tasks:
        - task_key: verify_seed_data
          notebook_task:
            notebook_path: ../../verification/verify_seed_data.py
          environment_key: default
        - task_key: verify_source_vs_bronze
          depends_on:
            - task_key: verify_seed_data
          notebook_task:
            notebook_path: ../../verification/verify_lakeflow_query_postgresql.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - psycopg2-binary
