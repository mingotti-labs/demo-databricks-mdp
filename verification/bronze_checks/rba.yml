source: rba
raw_schema: bronze_rba
publish_schema: bronze_rba_publish
# Append-only raw where each file holds only the recent days of a table: the checks
# compare the latest row per key (what streaming Auto CDC keeps) with Bronze Publish.
tables:
  - raw: observations_raw
    compare_latest_file_per: [series_id, observation_date]
    keys: [series_id, observation_date]
    columns: [table_id, series_id, observation_date, value, title, description, frequency, type, units, source, publication_date, ingested_timestamp, source_file_path]
    scd1: observations_scd1
