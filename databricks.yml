# GENERATED by cicd/apply_edition.py from cicd/databricks/free.yml -- edit the source, not this file.
bundle:
  name: demo-databricks-mdp

sync:
  exclude:
    - references/**

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Unity Catalog catalog this target writes into.
    default: mdp_dev
  ungm_base_url:
    description: Base URL for the UNGM API -- test endpoint for dev/tst, production for prd.
    default: https://wwwtest3.ungm.org
  acnc_base_url:
    description: Base URL for data.gov.au's CKAN Data API -- same for every target, no test/prod split exists for this source.
    default: https://data.gov.au
  acnc_resource_id:
    description: CKAN resource_id for the ACNC Charity Register CSV resource on data.gov.au.
    default: 8fb32972-24e9-4c95-885e-7140be51be8a
  acnc_row_limit:
    description: Row cap for the ACNC Charity Register pull -- empty means no cap (full dataset).
    default: "500"
  nsw_property_service_url:
    description: Esri ArcGIS REST FeatureServer base URL for NSW Spatial Services' Land Parcel and Property Theme -- same for every target, no test/prod split exists for this source.
    default: https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Land_Parcel_Property_Theme_multiCRS/FeatureServer
  nsw_property_layer_id:
    description: FeatureServer layer id for the "Property" layer within the NSW Land Parcel and Property Theme service.
    default: "12"
  nsw_property_row_limit:
    description: >-
      Row cap for the NSW property pull. Not a full-dataset pull anywhere,
      including prd -- the source's own maxRecordCount (100) means a full
      ~4.2M-row pull would need ~42,259 requests, confirmed too many for
      routine use. prd caps at 10000 (100 requests, matching ACNC's prd
      request volume) rather than pulling everything.
    default: "500"
  airroi_base_url:
    description: Base URL for AirROI's market intelligence API -- same for every target, no test/prod split exists for this source (no free sandbox at all).
    default: https://api.airroi.com
  iso3166_countries_url:
    description: URL for the ISO 3166-1 country codes CSV -- same for every target, no test/prod split exists for this source.
    default: https://raw.githubusercontent.com/ipregistry/iso3166/master/countries.csv
  iso3166_subdivisions_url:
    description: URL for the ISO 3166-2 subdivision codes CSV -- same for every target, no test/prod split exists for this source.
    default: https://raw.githubusercontent.com/ipregistry/iso3166/master/subdivisions.csv
  iso10383_mic_url:
    description: URL for the ISO 10383 market identifier code CSV -- same for every target, no test/prod split exists for this source.
    default: https://www.iso20022.org/sites/default/files/ISO10383_MIC/ISO10383_MIC.csv
  geonames_country_info_url:
    description: URL for GeoNames' countryInfo.txt dump -- same for every target, no test/prod split exists for this source.
    default: https://download.geonames.org/export/dump/countryInfo.txt
  geonames_admin1_codes_url:
    description: URL for GeoNames' admin1CodesASCII.txt dump -- same for every target, no test/prod split exists for this source.
    default: https://download.geonames.org/export/dump/admin1CodesASCII.txt
  geonames_admin2_codes_url:
    description: URL for GeoNames' admin2Codes.txt dump -- same for every target, no test/prod split exists for this source.
    default: https://download.geonames.org/export/dump/admin2Codes.txt
  geonames_cities_url:
    description: URL for GeoNames' cities500.zip dump (all populated places with population > 500) -- same for every target, no test/prod split exists for this source.
    default: https://download.geonames.org/export/dump/cities500.zip
  wikipedia_sp500_url:
    description: URL of Wikipedia's "List of S&P 500 companies" page -- same for every target, no test/prod split exists for this source.
    default: https://en.wikipedia.org/wiki/List_of_S%26P_500_companies
  rba_tables_url:
    description: Base URL of the RBA's statistical table CSV files (f11.1-data.csv, ...) -- same for every target, no test/prod split exists for this source.
    default: https://www.rba.gov.au/statistics/tables/csv
  fred_api_url:
    description: Base URL of the FRED (St. Louis Fed) API -- same for every target, no test/prod split exists for this source.
    default: https://api.stlouisfed.org/fred
  http_user_agent:
    description: User-Agent contact string sent to public sites that ask for one (Wikipedia, later SEC).
    default: mdp handsonessential@gmail.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-e3197e2d-933b.cloud.databricks.com
    variables:
      catalog: mdp_dev
      ungm_base_url: https://wwwtest3.ungm.org
      # Full dataset in dev since phase4e: a sample hid real data-quality
      # conflicts from Silver Normalised profiling (see its design.md).
      acnc_row_limit: ""
      nsw_property_row_limit: "500"
    # neon has no tst or prd Neon instance, so its resources exist in dev only
    # (openspec refactor-airroi-clickstream-neon). A target cannot include
    # files, so they are defined here instead of under resources/.
    resources:
      pipelines:
        neon_ecommerce_ingestion:
          name: bronze--neon--lakeflow--${bundle.target}
          configuration:
            pipelines.numUpdateRetryAttempts: '0'
            pipelines.maxFlowRetryAttempts: '0'
          ingestion_definition:
            connection_name: neon_dev
            objects:
            - table:
                source_catalog: app
                source_schema: public
                source_table: customers
                destination_table: customers_raw
                table_configuration:
                  query_based_connector_config:
                    cursor_columns:
                    - updated_at
                destination_catalog: ${var.catalog}
                destination_schema: bronze_neon
            - table:
                source_catalog: app
                source_schema: public
                source_table: products
                destination_table: products_raw
                table_configuration:
                  query_based_connector_config:
                    cursor_columns:
                    - updated_at
                destination_catalog: ${var.catalog}
                destination_schema: bronze_neon
            - table:
                source_catalog: app
                source_schema: public
                source_table: orders
                destination_table: orders_raw
                table_configuration:
                  query_based_connector_config:
                    cursor_columns:
                    - updated_at
                destination_catalog: ${var.catalog}
                destination_schema: bronze_neon
            - table:
                source_catalog: app
                source_schema: public
                source_table: order_items
                destination_table: order_items_raw
                table_configuration:
                  query_based_connector_config:
                    cursor_columns:
                    - updated_at
                destination_catalog: ${var.catalog}
                destination_schema: bronze_neon
          target: bronze_neon
          catalog: ${var.catalog}
        neon_scd_modeling_python:
          name: bronze--neon--scd--python--${bundle.target}
          catalog: ${var.catalog}
          schema: bronze_neon_publish
          serverless: true
          continuous: false
          configuration:
            pipelines.numUpdateRetryAttempts: '0'
            pipelines.maxFlowRetryAttempts: '0'
          libraries:
          - glob:
              include: src/layers/bronze/neon_publish/python/**
        silver_landing_neon:
          name: silver--neon--${bundle.target}
          catalog: ${var.catalog}
          schema: silver_landing
          serverless: true
          continuous: false
          configuration:
            pipelines.numUpdateRetryAttempts: '0'
            pipelines.maxFlowRetryAttempts: '0'
            workspace_file_path: ${workspace.file_path}
          libraries:
          - glob:
              include: src/layers/silver/landing/neon/**
      jobs:
        run_neon:
          name: run--neon--${bundle.target}
          tags:
            ci_auto_run: 'false'
          parameters:
          - name: verify
            default: 'false'
          tasks:
          - task_key: reset
            notebook_task:
              notebook_path: migrations/reset_full_load.py
              base_parameters:
                catalog: ${var.catalog}
                landing: silver_landing.neon__customers,silver_landing.neon__products,silver_landing.neon__orders,silver_landing.neon__order_items
          - task_key: bronze_ingestion
            depends_on:
            - task_key: reset
            pipeline_task:
              pipeline_id: ${resources.pipelines.neon_ecommerce_ingestion.id}
          - task_key: bronze_scd
            depends_on:
            - task_key: bronze_ingestion
            pipeline_task:
              pipeline_id: ${resources.pipelines.neon_scd_modeling_python.id}
          - task_key: verify_enabled
            condition_task:
              op: EQUAL_TO
              left: '{{job.parameters.verify}}'
              right: 'true'
          - task_key: verify_bronze
            depends_on:
            - task_key: bronze_scd
            - task_key: verify_enabled
              outcome: 'true'
            run_job_task:
              job_id: ${resources.jobs.verify_bronze.id}
              job_parameters:
                source: neon
          - task_key: verify_seed_data
            depends_on:
            - task_key: verify_enabled
              outcome: 'true'
            notebook_task:
              notebook_path: verification/verify_seed_data.py
            environment_key: default
          - task_key: verify_source_vs_bronze
            depends_on:
            - task_key: bronze_scd
            - task_key: verify_enabled
              outcome: 'true'
            notebook_task:
              notebook_path: verification/verify_bronze_neon_ingestion.py
              base_parameters:
                catalog: ${var.catalog}
            environment_key: default
          - task_key: silver
            depends_on:
            - task_key: bronze_scd
            - task_key: verify_bronze
            - task_key: verify_seed_data
            - task_key: verify_source_vs_bronze
            run_if: NONE_FAILED
            pipeline_task:
              pipeline_id: ${resources.pipelines.silver_landing_neon.id}
          - task_key: verify_silver
            depends_on:
            - task_key: silver
            - task_key: verify_enabled
              outcome: 'true'
            run_job_task:
              job_id: ${resources.jobs.verify_silver_landing.id}
              job_parameters:
                source: neon
          - task_key: tag_patterns
            depends_on:
            - task_key: silver
            notebook_task:
              notebook_path: src/common/tag_design_patterns.py
              base_parameters:
                catalog: ${var.catalog}
                source: neon
                workspace_file_path: ${workspace.file_path}
          environments:
          - environment_key: default
            spec:
              environment_version: '2'
              dependencies:
              - psycopg2-binary
        seed_neon_ecommerce:
          name: seed--neon--data--${bundle.target}
          tasks:
          - task_key: seed
            notebook_task:
              notebook_path: src/seed_data/seed_neon_ecommerce.py
            environment_key: default
          environments:
          - environment_key: default
            spec:
              environment_version: '2'
              dependencies:
              - psycopg2-binary
              - faker

  prd:
    mode: production
    workspace:
      host: https://dbc-e3197e2d-933b.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mdp_prd
      ungm_base_url: https://www.ungm.org
      acnc_row_limit: ""
      nsw_property_row_limit: "10000"
    permissions:
      - group_name: users
        level: CAN_MANAGE
