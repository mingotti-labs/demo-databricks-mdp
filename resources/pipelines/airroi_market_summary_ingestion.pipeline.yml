resources:
  pipelines:
    airroi_market_summary_ingestion:
      name: bronze--airroi--${bundle.target}
      catalog: ${var.catalog}
      schema: bronze_airroi
      serverless: true
      continuous: false
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"
        airroi_base_url: ${var.airroi_base_url}
        workspace_file_path: ${workspace.file_path}
      environment:
        dependencies:
          - requests
      libraries:
        - glob:
            include: ../../src/layers/bronze/airroi/**
        - glob:
            include: ../../src/layers/bronze/airroi_publish/**
