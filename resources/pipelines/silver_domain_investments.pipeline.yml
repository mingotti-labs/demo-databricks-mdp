resources:
  pipelines:
    silver_domain_investments:
      name: silver--domain--investments--${bundle.target}
      catalog: ${var.catalog}
      schema: silver_domain_investments
      serverless: true
      continuous: false
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"
        workspace_file_path: ${workspace.file_path}
      libraries:
        - glob:
            include: ../../src/layers/silver/domain/investments/**
