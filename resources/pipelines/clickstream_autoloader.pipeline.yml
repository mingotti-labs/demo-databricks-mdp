      name: bronze--clickstream--autoloader--python--add-new-columns--${bundle.target}
      catalog: ${var.catalog}
      schema: bronze_clickstream
      serverless: true
      continuous: false
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
