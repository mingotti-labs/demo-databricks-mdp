resources:
  pipelines:
    silver_landing_yahoo:
      name: silver--yahoo--${bundle.target}
      catalog: ${var.catalog}
      schema: silver_landing_yahoo
      serverless: true
      continuous: false
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"
        workspace_file_path: ${workspace.file_path}
      libraries:
        - glob:
            include: ../../src/layers/silver/landing/yahoo/**
