resources:
  pipelines:
    gold_analytics_gateway:
      name: gold--analytics_gateway--${bundle.target}
      catalog: ${var.catalog}
      schema: gold_analytics_gateway
      serverless: true
      continuous: false
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"
        workspace_file_path: ${workspace.file_path}
      libraries:
        - glob:
            include: ../../src/layers/gold/analytics_gateway/**
