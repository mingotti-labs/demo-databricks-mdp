resources:
  pipelines:
    silver_landing_nsw_spatial:
      name: silver--nsw_spatial--${bundle.target}
      catalog: ${var.catalog}
      schema: silver_landing
      serverless: true
      continuous: false
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"
        workspace_file_path: ${workspace.file_path}
      libraries:
        - glob:
            include: ../../src/layers/silver/landing/nsw_spatial/**
