resources:
  pipelines:
    silver_normalised_acnc:
      name: silver--acnc--${bundle.target}
      catalog: ${var.catalog}
      schema: silver_normalised_acnc
      serverless: true
      continuous: false
      configuration:
        workspace_file_path: ${workspace.file_path}
      # Landing only: Silver Normalised is rebuilt by run_acnc's normalised
      # task (openspec correct-platform-timestamps).
      libraries:
        - file:
            path: ../../src/layers/silver/landing/acnc/charity_register.py
