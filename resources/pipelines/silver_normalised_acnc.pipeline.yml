resources:
  pipelines:
    silver_normalised_acnc:
      name: silver--acnc--${bundle.target}
      catalog: ${var.catalog}
      schema: silver_normalised_acnc
      serverless: true
      continuous: false
      configuration:
        workspace_file_path: ${workspace.file_path}
        normalised_spec: src/layers/silver/normalised/specs/acnc.yml
      environment:
        dependencies:
          - pyyaml
      libraries:
        - file:
            path: ../../src/layers/silver/normalised/pipeline.py
        # A pipeline's libraries cannot mix `file` and `glob` entries (the
        # API rejects it), so the Landing file is listed as a file too.
        - file:
            path: ../../src/layers/silver/landing/acnc/charity_register.py
