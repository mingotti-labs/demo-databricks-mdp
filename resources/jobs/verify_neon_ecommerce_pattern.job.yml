resources:
  jobs:
    verify_neon_ecommerce_pattern:
      name: verify--bronze--neon--${bundle.target}
      # Checks the bronze tables only. The Neon connection is proven live by the
      # ingestion pipeline itself, and the source's seed data (verification/
      # verify_seed_data.py, run by hand) needs the neon-postgres secret scope,
      # which the CI/CD service principal cannot read.
      tasks:
        - task_key: verify_bronze_ingestion
          notebook_task:
            notebook_path: ../../verification/verify_bronze_neon_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
