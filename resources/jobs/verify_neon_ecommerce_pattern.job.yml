resources:
  jobs:
    verify_neon_ecommerce_pattern:
      name: verify--bronze--neon--${bundle.target}
      tasks:
        # The UC connection is proven live by the ingestion pipeline itself; a
        # separate check needs CREATE CATALOG, which the CI/CD service principal
        # does not have.
        - task_key: verify_seed_data
          notebook_task:
            notebook_path: ../../verification/verify_seed_data.py
          environment_key: default

        - task_key: verify_bronze_ingestion
          depends_on:
            - task_key: verify_seed_data
          notebook_task:
            notebook_path: ../../verification/verify_bronze_neon_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - psycopg2-binary
