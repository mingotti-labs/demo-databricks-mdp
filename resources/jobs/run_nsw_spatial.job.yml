resources:
  jobs:
    run_nsw_spatial:
      name: run--nsw_spatial--${bundle.target}
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.nsw_property_ingestion.id}
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze
          run_job_task:
            job_id: ${resources.jobs.verify_nsw_property_pattern.id}
        - task_key: silver
          depends_on:
            - task_key: verify_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_nsw_spatial.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: nsw_spatial
        - task_key: tag_patterns
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: nsw_spatial
              workspace_file_path: ${workspace.file_path}
