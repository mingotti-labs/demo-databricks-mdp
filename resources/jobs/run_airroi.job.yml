resources:
  jobs:
    run_airroi:
      name: run--airroi--${bundle.target}
      tags:
        ci_auto_run: "false"
      tasks:
        - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.airroi_market_summary_ingestion.id}
        - task_key: bronze_scd
          depends_on:
            - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.airroi_market_summary_scd_modeling.id}
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze_scd
          run_job_task:
            job_id: ${resources.jobs.verify_airroi_market_summary_pattern.id}
        - task_key: silver
          depends_on:
            - task_key: verify_bronze
          run_job_task:
            job_id: ${resources.jobs.silver_airroi.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
          run_job_task:
            job_id: ${resources.jobs.verify_silver_normalised.id}
            job_parameters:
              source: airroi
