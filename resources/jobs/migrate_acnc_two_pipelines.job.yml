resources:
  jobs:
    migrate_acnc_two_pipelines:
      name: migrate--acnc--two-pipelines--${bundle.target}
      tasks:
        - task_key: migrate
          notebook_task:
            notebook_path: ../../migrations/acnc_two_pipelines.py
            base_parameters:
              catalog: ${var.catalog}
              ingestion_id: ${resources.pipelines.acnc_charity_register_ingestion.id}
              scd_id: ${resources.pipelines.acnc_charity_register_scd_modeling.id}
              landing_id: ${resources.pipelines.silver_landing_acnc.id}
              normalised_id: ${resources.pipelines.silver_normalised_acnc.id}
