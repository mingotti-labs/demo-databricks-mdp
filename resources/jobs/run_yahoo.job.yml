resources:
  jobs:
    run_yahoo:
      name: run--yahoo--${bundle.target}
      parameters:
        # Verification is opt-in: run with verify=true to include both checks.
        - name: verify
          default: "false"
        # Symbols to reload in full, comma-separated, or * for every symbol.
        - name: reload_symbols
          default: ""
      tasks:
        # Writes dated files into bronze_yahoo.s3_raw; reads the S&P 500 symbols
        # (run_wikipedia) and the benchmarks (run_portfolio). run_id lets a repair
        # of this run skip the symbols it already fetched.
        - task_key: fetch
          notebook_task:
            notebook_path: ../../src/common/fetch_yahoo.py
            base_parameters:
              catalog: ${var.catalog}
              workspace_file_path: ${workspace.file_path}
              reload_symbols: "{{job.parameters.reload_symbols}}"
              run_id: "{{job.run_id}}"
        - task_key: bronze
          depends_on:
            - task_key: fetch
          pipeline_task:
            pipeline_id: ${resources.pipelines.yahoo_market_data_ingestion.id}
        - task_key: verify_enabled
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.verify}}"
            right: "true"
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_bronze.id}
            job_parameters:
              source: yahoo
        # NONE_FAILED, not the default ALL_SUCCESS: with verification off,
        # verify_bronze is excluded, which ALL_SUCCESS does not accept.
        - task_key: silver
          depends_on:
            - task_key: bronze
            - task_key: verify_bronze
          run_if: NONE_FAILED
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_yahoo.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: yahoo
        - task_key: tag_patterns
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: yahoo
              workspace_file_path: ${workspace.file_path}
