resources:
  jobs:
    run_acnc:
      name: run--acnc--${bundle.target}
      parameters:
        # Verification is opt-in: run with verify=true to include both checks.
        - name: verify
          default: "false"
      tasks:
        # One-off (openspec correct-platform-timestamps); a no-op once applied.
        - task_key: reset
          notebook_task:
            notebook_path: ../../migrations/acnc_reset_scd2.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze
          depends_on:
            - task_key: reset
          pipeline_task:
            pipeline_id: ${resources.pipelines.acnc_charity_register_ingestion.id}
        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_normalised_acnc.id}
        - task_key: normalised
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/layers/silver/normalised/rebuild.py
            base_parameters:
              catalog: ${var.catalog}
              source: acnc
              workspace_file_path: ${workspace.file_path}
        - task_key: tag
          depends_on:
            - task_key: normalised
          notebook_task:
            notebook_path: ../../src/layers/silver/normalised/tag.py
            base_parameters:
              catalog: ${var.catalog}
              source: acnc
              workspace_file_path: ${workspace.file_path}
        - task_key: tag_patterns
          depends_on:
            - task_key: normalised
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: acnc
              workspace_file_path: ${workspace.file_path}
        # Verification is opt-in and last: a task that depends on an excluded task
        # is itself excluded, so nothing that must run may depend on these.
        - task_key: verify_enabled
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.verify}}"
            right: "true"
        - task_key: verify_bronze
          depends_on:
            - task_key: tag
            - task_key: tag_patterns
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_acnc_charity_register.id}
        - task_key: verify_silver
          depends_on:
            - task_key: verify_bronze
          run_job_task:
            job_id: ${resources.jobs.verify_silver_normalised.id}
            job_parameters:
              source: acnc
