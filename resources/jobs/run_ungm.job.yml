resources:
  jobs:
    run_ungm:
      name: run--ungm--${bundle.target}
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.ungm_unspsc_ingestion.id}
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze
          run_job_task:
            job_id: ${resources.jobs.verify_unspsc_pattern.id}
        - task_key: silver
          depends_on:
            - task_key: verify_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_ungm.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: ungm
        - task_key: tag_patterns
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: ungm
              workspace_file_path: ${workspace.file_path}
