resources:
  jobs:
    run_rba:
      name: run--rba--${bundle.target}
      parameters:
        # Verification is opt-in: run with verify=true to include both checks.
        - name: verify
          default: "false"
        # reload=true writes every row of every table, not just the recent days.
        - name: reload
          default: "false"
      tasks:
        # Writes dated files into bronze_rba.s3_raw.
        - task_key: fetch
          notebook_task:
            notebook_path: ../../src/common/fetch_rba.py
            base_parameters:
              catalog: ${var.catalog}
              user_agent: ${var.http_user_agent}
              tables_url: ${var.rba_tables_url}
              reload: "{{job.parameters.reload}}"
              workspace_file_path: ${workspace.file_path}
        - task_key: bronze
          depends_on:
            - task_key: fetch
          pipeline_task:
            pipeline_id: ${resources.pipelines.rba_rates_ingestion.id}
        - task_key: verify_enabled
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.verify}}"
            right: "true"
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_bronze.id}
            job_parameters:
              source: rba
        # NONE_FAILED, not the default ALL_SUCCESS: with verification off,
        # verify_bronze is excluded, which ALL_SUCCESS does not accept.
        - task_key: silver
          depends_on:
            - task_key: bronze
            - task_key: verify_bronze
          run_if: NONE_FAILED
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_rba.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: rba
        - task_key: tag_patterns
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: rba
              workspace_file_path: ${workspace.file_path}
