resources:
  jobs:
    run_iso:
      name: run--iso--${bundle.target}
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.iso_country_reference_ingestion.id}
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze
          run_job_task:
            job_id: ${resources.jobs.verify_iso_reference_pattern.id}
        - task_key: silver
          depends_on:
            - task_key: verify_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_iso.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: iso
