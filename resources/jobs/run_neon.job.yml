resources:
  jobs:
    run_neon:
      name: run--neon--${bundle.target}
      # dev only: there is no Neon instance for tst or prd to ingest from.
      tags:
        ci_auto_run: "false"
      parameters:
        # Verification is opt-in: run with verify=true to include both checks.
        - name: verify
          default: "false"
      tasks:
        # One-off (openspec refactor-airroi-clickstream-neon); a no-op once applied.
        - task_key: reset
          notebook_task:
            notebook_path: ../../migrations/reset_full_load.py
            base_parameters:
              catalog: ${var.catalog}
              landing: silver_landing_neon.customers,silver_landing_neon.products,silver_landing_neon.orders,silver_landing_neon.order_items
        - task_key: bronze_ingestion
          depends_on:
            - task_key: reset
          pipeline_task:
            pipeline_id: ${resources.pipelines.neon_ecommerce_ingestion.id}
        - task_key: bronze_scd
          depends_on:
            - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.neon_scd_modeling_python.id}
        - task_key: verify_enabled
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.verify}}"
            right: "true"
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze_scd
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_bronze.id}
            job_parameters:
              source: neon
        # NONE_FAILED, not the default ALL_SUCCESS: with verification off,
        # verify_bronze is excluded, which ALL_SUCCESS does not accept.
        - task_key: silver
          depends_on:
            - task_key: bronze_scd
            - task_key: verify_bronze
          run_if: NONE_FAILED
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_neon.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: neon
        - task_key: tag_patterns
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: neon
              workspace_file_path: ${workspace.file_path}
