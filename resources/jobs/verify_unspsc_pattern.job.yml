resources:
  jobs:
    verify_unspsc_pattern:
      name: verify--ungm--unspsc--${bundle.target}
      tasks:
        - task_key: verify_ingestion
          notebook_task:
            notebook_path: ../../verification/verify_unspsc_ingestion.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: verify_scd
          depends_on:
            - task_key: verify_ingestion
          notebook_task:
            notebook_path: ../../verification/verify_unspsc_scd.py
            base_parameters:
              catalog: ${var.catalog}
