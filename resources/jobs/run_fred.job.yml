resources:
  jobs:
    run_fred:
      name: run--fred--${bundle.target}
      parameters:
        # Verification is opt-in: run with verify=true to include both checks.
        - name: verify
          default: "false"
        # reload=true requests every observation of every series, not just the recent days.
        - name: reload
          default: "false"
      tasks:
        # Writes a dated file into bronze_fred.s3_raw; reads the API key from the fred secret scope.
        - task_key: fetch
          notebook_task:
            notebook_path: ../../src/common/fetch_fred.py
            base_parameters:
              catalog: ${var.catalog}
              api_url: ${var.fred_api_url}
              reload: "{{job.parameters.reload}}"
              workspace_file_path: ${workspace.file_path}
        - task_key: bronze
          depends_on:
            - task_key: fetch
          pipeline_task:
            pipeline_id: ${resources.pipelines.fred_rates_ingestion.id}
        - task_key: verify_enabled
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.verify}}"
            right: "true"
        - task_key: verify_bronze
          depends_on:
            - task_key: bronze
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_bronze.id}
            job_parameters:
              source: fred
        # NONE_FAILED, not the default ALL_SUCCESS: with verification off,
        # verify_bronze is excluded, which ALL_SUCCESS does not accept.
        - task_key: silver
          depends_on:
            - task_key: bronze
            - task_key: verify_bronze
          run_if: NONE_FAILED
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_landing_fred.id}
        - task_key: verify_silver
          depends_on:
            - task_key: silver
            - task_key: verify_enabled
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.verify_silver_landing.id}
            job_parameters:
              source: fred
        - task_key: tag_patterns
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/common/tag_design_patterns.py
            base_parameters:
              catalog: ${var.catalog}
              source: fred
              workspace_file_path: ${workspace.file_path}
