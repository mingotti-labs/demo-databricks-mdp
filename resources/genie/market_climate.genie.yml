        "title": "Market Climate",
        "description": "Ask about the market climate lights, the S&P 500 price/earnings ratio and its members.",
        "warehouse_id": "${var.warehouse_id}",
        "parent_path": "${workspace.resource_path}",
        "serialized_space": {
          "version": 2,
          "config": {
            "sample_questions": [
