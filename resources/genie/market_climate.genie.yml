          "instructions": {
            "text_instructions": [
              {
                "id": "cbde2df6a7c89370edc449dc5705d30c",
                "content": [
                  "The Investment Intelligence agent answers questions about the US market and the inflation game: whether the market is too expensive, whether the Fed is in the way and whether the market is going up (market climate, for the S&P 500), and whether prices are heading for inflation or deflation (the inflation/deflation rating).\n",
                  "Two climates are shown each day, \"long_run\" and \"modern\". Each is read from three yes/no answers (signal_code too_expensive, fed_in_the_way, market_going_up). Yes is always the unfavourable answer.\n",
                  "Too expensive: the S&P 500 price/earnings ratio on 10-year inflation-adjusted earnings is above 22 for long_run and above 30 for modern. Drilldown bands: 16 and 22 (long_run), 22 and 30 (modern).\n",
                  "Fed in the way: the latest change of the Fed target rate (upper limit) was a hike less than 6 months ago. A new hike restarts the 6 months, a cut ends it.\n",
                  "Market going up: the S&P 500 closes above its 200-day simple moving average (measured_value is the close, threshold_value the average). Yes means above the average. Its band is for drilldown only: red below the average, green above and rising, yellow above and flat or falling.\n",
                  "The result row of a climate has signal_code \"climate\": yes_count of 3 and the light. 2 or 3 yes is red (action sell), 1 yes is yellow (buy and hold), 0 yes is green (strong buy).\n",
                  "Use monitor_daily_signal for lights, answers and reasons. One row per day, monitor, lens and signal. reason_text is a plain sentence for the row.\n",
                  "\"Today\" or \"now\" means the latest signal_date in monitor_daily_signal and the latest valuation_date in valuation_daily_index. Dates are trading days; a day without a row has no light.\n",
                  "Three price/earnings measures are stored per day in valuation_daily_index and valuation_daily_index_member: trailing twelve months, plain 10-year average, and 10-year average adjusted for inflation to that day's money. Only the 10-year inflation-adjusted one votes. The ratio of the index is total market value over total earnings of the members used, not an average of member ratios.\n",
                  "Finance sites show the trailing P/E. A company that earned little in earlier years has a small 10-year average, so its inflation-adjusted P/E is far higher than its trailing P/E (EQT Corporation: about 12 trailing, about 750 on 10-year inflation-adjusted earnings).\n",
                  "valuation_daily_index_member has one row per member and day, used or not. is_used says whether it is in the index figures; exclusion_reason_code says why not: no_recent_price, no_filing, no_share_count, no_net_income, no_ten_year_average, no_consumer_price_index.\n",
                  "price_earnings_without_member_ratio is the index P/E without that member. price_earnings_effect_ratio is the index P/E minus that: positive means the member pushes the index P/E up, negative down. Effects are one at a time and do not add up to the index P/E.\n",
                  "market_value_share_ratio is the member's share of the index market value (0 to 1). Amounts are in US dollars.\n",
                  "To name a company use silver_domain_investments company (company_name) joined on company_id; its sector is gics_sector_name. Sectors are today's sectors applied to every day.\n",
                  "Prices are in price_daily (price_close, price_high, price_low per listing and price_date); join on listing_id.\n",
                  "Show dates as YYYY-MM-DD. Round ratios to 2 decimals unless asked for more.\n",
                  "The Inflation Deflation monitor is monitor_code inflation_deflation in monitor_daily_signal (one lens, game_plan). Four star rows per day (signal_code commodity_prices, consumer_prices, gold_prices, interest_rates; is_yes true means the star is on, pointing to inflation) and one rating row (signal_code rating).\n",
                  "Stars: commodity_prices is on when the 200-day average of the CRB commodity index (^TRCCRB) is rising; consumer_prices when the 200-day average of the US consumer price index is rising; gold_prices when gold futures (GC=F) close above their 200-day average; interest_rates when the short-term rate (federal funds effective rate) is above its 200-day average.\n",
                  "Rating: yes_count is the stars on (0 to 4) and measured_value the rating; action_name is the label: 4 Increasing Inflation, 3 Inflation Danger, 2 Some Inflation Risk, 1 Mild or Decreasing Inflation, 0 Decreasing Inflation, -1 Deflation (no star on and US consumer prices below their level 12 months earlier; threshold_value on the rating row is that 12-month change in percent).\n",
                  "market_rate_indicator_daily has, per series and trading day, the value known that day, its 200-day average and the average's 20-day change: the CPI index, the CPI change against the previous reading and over 12 months, the federal funds effective rate and the real rate (effective rate minus the 12-month CPI change, percent). The real rate is shown for context and does not vote.\n",
                  "price_indicator_daily has per listing and day the 200-day average of the adjusted close, its 20-day slope ratio and the 52-week high and low (price_high_fifty_two_week_amount, price_low_fifty_two_week_amount). Commodity benchmarks are listings with trading_symbol_code ^TRCCRB (CRB, votes), ^SPGSCI, GC=F (gold, votes), SI=F, HG=F, CL=F, DBC and GSG (context).\n",
                  "Consumer prices count from the first day of their month, before they are published, so the rating can look ahead by up to six weeks.\n",
                  "The Currency Monitor is monitor_code currency in monitor_daily_signal, with two lenses: us_dollar (currencies against the US dollar, plus the two dollar indexes) and australian_dollar (currencies against the Australian dollar, the investor's base currency). There is one row per currency, lens and day (signal_code eur, jpy, gbp, chf, cad, sek, aud, nzd, cny, usd), a summary row per lens (yes_count currencies gaining, action_name such as \"6 of 9 gaining\"), and in the us_dollar lens the rows dollar_index (US Dollar Index, DXY, six currencies, the megatrend) and dollar_broad_index (Federal Reserve broad index, about 26 currencies, context).\n",
                  "A currency is gaining against a base (is_yes true, band green when its average is rising) when the value of one unit of it in that base (measured_value) is above its 200-day average (threshold_value); losing otherwise (band red). For the dollar indexes is_yes true means the dollar is strong.\n",
                  "Values are worked out from FRED exchange rates quoted against the US dollar: a rate quoted as units per US dollar is inverted, and the value in Australian dollars is the value in US dollars divided by the value of one Australian dollar in US dollars on the same day (market_rate_indicator_daily rate_code currency_value_<code>_in_usd and currency_value_<code>_in_aud).\n",
                  "Interest rates of the main countries are in market_rate_daily and market_rate_indicator_daily: short-term (the federal funds, RBA cash, ECB deposit rates and 3-month interbank rates of Japan, Canada, Switzerland, Sweden, New Zealand and China, and the UK call money rate) and 10-year government bond yields (none for China). Most are monthly readings carried forward; observation_date is the date of the reading. The euro area 10-year yield is stale (last reading 2026-01).\n",
                  "When a question about a market climate answer or light does not name a lens, answer for both lenses (long_run and modern) of the latest day, even when they agree.\n",
                  "For the latest interest rate of a country, read market_rate_daily (one row per reading) and show observation_date, the date of the reading; market_rate_indicator_daily repeats the last reading on every trading day, so its indicator_date is not the date of the reading.\n",
                  "To rank countries by what their currency and interest rate would have paid, in a base currency (default the Australian dollar; the US dollar is the other base), use the Yield Deep Dive method: short-term interest rate in percent plus the change of the currency's value in the base over the last 12 months in percent (the value in market_rate_indicator_daily, rate_code currency_value_<code>_in_<base>, divided by the same value 252 trading days earlier, minus 1, times 100). The base currency itself has no currency change. Never add a ratio such as a distance from an average to a percent rate without multiplying it by 100. Always say the result looks backward, is not a forecast and that the rates are interbank or policy rates, not bank CD rates; show the date of each rate reading.\n",
                  "\n",
                  "The strategies are in strategy_daily_event: one row per strategy_code, trading_symbol_code, event_date and event_code, only when something happens. strategy_code is bear_market_fund (strategy 001, on the S&P 500, trading_symbol_code ^GSPC) or short_selling (strategy 002, on index members). event_code is setup_start (the first week all setup conditions hold), entry or setup_end (the first week one fails). setup_start_date is the date of the setup_start that opened the period and is the same on every event of that period; no setup_end yet means the period is still on. Entries are numbered within a period (entry_number, is_first_entry). Events are dated on the week's last trading day (a Friday, or Thursday before a holiday Friday); only complete weeks count and the history starts on 2025-10-29, when the market climate begins.\n",
                  "Both strategies run only when a market climate light is red: either lens (long_run or modern) red is enough.\n",
                  "Strategy 001, the bear market mutual fund: setup is on when a climate light is red and the S&P 500 closed the week below its close five weeks earlier. Entry (week_change_ratio is the Friday-to-Friday change): a fall of 5% or more is half of equity (entry_band_code half_of_equity), 2.5% to 5% a quarter (quarter_of_equity), a smaller fall waits for Monday to Wednesday and a close 2.5% below that week's close is an interim entry (interim_quarter_of_equity, dated on that day). Exits (not stored, because they depend on what is held): the week up 3% or more sell 10% of equity per 3%; a Friday close above its close five weeks earlier or a VIX above 50 sell everything. Invest at most 50% of equity in 25% steps. The bear funds are SQQQ and PSQ (Nasdaq-100, 3x and 1x), SH, SDS and SPXU (S&P 500, 1x, 2x and 3x); their prices are in price_daily by trading_symbol_code.\n",
                  "Strategy 002, short selling: setup is on when a climate light is red, price_to_sales_ratio is above 15 and the stock's weekly close has fallen three weeks in a row (down_week_count 3 or more). Entry is the sixth week in a row down (down_week_count 6) while the setup is on. A stock leaves the setup when it rises for a week, its price-to-sales falls to 15 or below, or the climate leaves red. Hold 3 to 5 stocks and risk at most 1% of equity in each; exits (climate no longer red, 25% against you, 25% trailing stop) need a position and are not stored.\n",
                  "A short selling candidate is a stock whose latest setup period has a setup_start and no setup_end yet; its entry light is green when that period has an entry. When asked for candidates, answer for the latest complete week.\n"
                ]
              }
            ],
            "example_question_sqls": [
              {
                "id": "06069a514127d85375db0fb49f358390",
                "question": [
                  "How fresh is the inflation data?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'inflation_deflation' AND signal_code = 'rating' AND signal_date <= current_date()) SELECT (SELECT day FROM asof) AS rating_date, (SELECT max(price_date) FROM ${var.catalog}.silver_domain_investments.price_indicator_daily WHERE trading_symbol_code = '^TRCCRB') AS crb_price_date, (SELECT max(price_date) FROM ${var.catalog}.silver_domain_investments.price_indicator_daily WHERE trading_symbol_code = 'GC=F') AS gold_price_date, (SELECT max(observation_date) FROM ${var.catalog}.silver_domain_investments.market_rate_daily WHERE rate_code = 'us_federal_funds_effective_rate') AS rate_date, (SELECT max(observation_date) FROM ${var.catalog}.silver_domain_investments.market_rate_daily WHERE rate_code = 'us_cpi_all_items_not_seasonally_adjusted' AND NOT is_carried_forward) AS cpi_reading_date"
                ],
                "usage_guidance": [
                  "The rating date and the latest date of each input."
                ]
              },
              {
                "id": "1703274fab3cbf3545fcdd2a023ab27c",
                "question": [
                  "How has the S&P 500 P/E moved over time?"
                ],
                "sql": [
                  "SELECT i.valuation_date, i.price_earnings_ten_year_average_inflation_adjusted_ratio AS pe_ten_year_adjusted, i.price_earnings_trailing_twelve_months_ratio AS pe_trailing, add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END)) AS range_start_date, current_date() AS range_end_date FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index i WHERE i.valuation_date >= add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END)) ORDER BY i.valuation_date"
                ],
                "usage_guidance": [
                  "Both measures per day, last 36 months."
                ]
              },
              {
                "id": "1cbaacd1d7031be037de4357c1a0eff8",
                "question": [
                  "How have Switzerland's interest rates changed?"
                ],
                "sql": [
                  "WITH countries AS (SELECT * FROM VALUES ('USD', 'US dollar', 'us_federal_funds_effective_rate', 'us_10_year_treasury_yield'), ('EUR', 'Euro', 'euro_area_deposit_facility_rate', 'euro_area_10_year_government_bond_yield'), ('JPY', 'Japanese yen', 'japan_3_month_interbank_rate', 'japan_10_year_government_bond_yield'), ('GBP', 'British pound', 'uk_call_money_rate', 'uk_10_year_government_bond_yield'), ('CHF', 'Swiss franc', 'switzerland_3_month_interbank_rate', 'switzerland_10_year_government_bond_yield'), ('CAD', 'Canadian dollar', 'canada_3_month_interbank_rate', 'canada_10_year_government_bond_yield'), ('SEK', 'Swedish krona', 'sweden_3_month_interbank_rate', 'sweden_10_year_government_bond_yield'), ('AUD', 'Australian dollar', 'rba_cash_rate_target', 'australia_10_year_government_bond_yield'), ('NZD', 'New Zealand dollar', 'new_zealand_3_month_interbank_rate', 'new_zealand_10_year_government_bond_yield'), ('CNY', 'Chinese yuan', 'china_3_month_interbank_rate', '-') AS countries(currency_code, currency_name, short_rate_code, long_rate_code)) SELECT i.indicator_date, CASE i.rate_code WHEN c.short_rate_code THEN 'Short-term rate' ELSE '10-year yield' END AS rate_label, i.rate_value FROM countries c JOIN ${var.catalog}.silver_domain_investments.market_rate_indicator_daily i ON i.rate_code IN (c.short_rate_code, c.long_rate_code) WHERE c.currency_code = 'CHF' AND i.indicator_date >= add_months(date_trunc('MONTH', current_date()), -35) ORDER BY i.indicator_date"
                ],
                "usage_guidance": [
                  "Replace 'CHF' with the currency code of the country asked about."
                ]
              },
              {
                "id": "22a8d4f4cc1751c4ef05822a3fdf3bbe",
                "question": [
                  "How fresh is the data?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' AND signal_date <= current_date()) SELECT (SELECT day FROM asof) AS climate_date, (SELECT max(price_date) FROM ${var.catalog}.silver_domain_investments.price_indicator_daily WHERE trading_symbol_code = '^GSPC') AS sp500_price_date, (SELECT max(observation_date) FROM ${var.catalog}.silver_domain_investments.market_rate_daily WHERE rate_code = 'us_federal_funds_target_upper') AS fed_rate_date, (SELECT max(observation_date) FROM ${var.catalog}.silver_domain_investments.market_rate_daily WHERE rate_code = 'us_cpi_all_items_not_seasonally_adjusted') AS cpi_date"
                ],
                "usage_guidance": [
                  "The climate date and the latest date of each input."
                ]
              },
              {
                "id": "38b205b268214204c5b52b2b7947b5bb",
                "question": [
                  "Which stocks are short selling candidates this week?"
                ],
                "sql": [
                  "WITH states AS ( WITH red AS ( SELECT signal_date, max(CAST(band_code = 'red' AS INT)) = 1 AS is_red FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' GROUP BY signal_date ), index_days AS ( SELECT listing_id, trading_symbol_code, price_date, price_close, ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily WHERE trading_symbol_code = '^GSPC' ), index_weeks AS ( SELECT max(listing_id) AS listing_id, max(trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', price_date) AS DATE) AS week_start, max(price_date) AS week_end_date, max_by(price_close, price_date) AS week_close, min(ingested_timestamp) AS ingested_timestamp FROM index_days GROUP BY CAST(date_trunc('WEEK', price_date) AS DATE) ), bear_weeks AS ( SELECT w.*, lag(week_close, 1) OVER (ORDER BY week_start) AS previous_close, lag(week_close, 5) OVER (ORDER BY week_start) AS five_weeks_close FROM index_weeks w ), bear_states AS ( SELECT 'bear_market_fund' AS strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, CAST(week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(five_weeks_close AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(week_close / previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, CAST(NULL AS DECIMAL(18, 4)) AS price_to_sales_ratio, CAST(NULL AS INT) AS down_week_count, r.is_red AND week_close < five_weeks_close AS is_setup_on, r.is_red, w.ingested_timestamp FROM bear_weeks w JOIN red r ON r.signal_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ), stock_weeks AS ( SELECT p.listing_id, max(p.trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', p.price_date) AS DATE) AS week_start, max_by(p.price_close_adjusted, p.price_date) AS week_close, min(p.ingested_timestamp) AS ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily p JOIN (SELECT DISTINCT listing_id FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member) m ON m.listing_id = p.listing_id WHERE p.price_date >= (SELECT date_sub(min(signal_date), 70) FROM red) GROUP BY p.listing_id, CAST(date_trunc('WEEK', p.price_date) AS DATE) ), stock_down AS ( SELECT *, coalesce(CAST(week_close < lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS INT), 0) AS is_down FROM stock_weeks ), stock_run AS ( SELECT *, sum(1 - is_down) OVER (PARTITION BY listing_id ORDER BY week_start) AS run_group FROM stock_down ), stock_streak AS ( SELECT *, sum(is_down) OVER (PARTITION BY listing_id, run_group ORDER BY week_start) AS down_weeks, lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS previous_close FROM stock_run ), short_states AS ( SELECT 'short_selling' AS strategy_code, s.trading_symbol_code, s.listing_id, s.week_start, w.week_end_date, CAST(s.week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(NULL AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(s.week_close / s.previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, m.price_to_sales_ratio, CAST(s.down_weeks AS INT) AS down_week_count, r.is_red AND m.price_to_sales_ratio > 15 AND s.down_weeks >= 3 AS is_setup_on, r.is_red, s.ingested_timestamp FROM stock_streak s JOIN index_weeks w ON w.week_start = s.week_start JOIN red r ON r.signal_date = w.week_end_date JOIN ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m ON m.listing_id = s.listing_id AND m.valuation_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ) SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM bear_states UNION ALL SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM short_states ), short_week AS (SELECT max(week_end_date) AS day FROM states WHERE strategy_code = 'short_selling' AND week_end_date <= current_date()), short AS (SELECT * FROM states WHERE strategy_code = 'short_selling' AND week_end_date = (SELECT day FROM short_week)), starts AS (SELECT trading_symbol_code, max(setup_start_date) AS setup_start_date FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'short_selling' AND event_code = 'setup_start' AND event_date <= (SELECT day FROM short_week) GROUP BY trading_symbol_code), entries AS (SELECT trading_symbol_code, setup_start_date, count(*) AS entry_count FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'short_selling' AND event_code = 'entry' AND event_date <= (SELECT day FROM short_week) GROUP BY trading_symbol_code, setup_start_date) SELECT s.trading_symbol_code, c.company_name, st.setup_start_date, s.week_end_date, s.price_to_sales_ratio, s.down_week_count, s.week_change_ratio, 'green' AS setup_light, CASE WHEN coalesce(e.entry_count, 0) > 0 THEN 'green' ELSE 'grey' END AS entry_light FROM short s JOIN starts st ON st.trading_symbol_code = s.trading_symbol_code LEFT JOIN entries e ON e.trading_symbol_code = s.trading_symbol_code AND e.setup_start_date = st.setup_start_date LEFT JOIN ${var.catalog}.silver_domain_investments.listing l ON l.listing_id = s.listing_id LEFT JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = l.company_id WHERE s.is_setup_on ORDER BY s.down_week_count DESC, s.price_to_sales_ratio DESC"
                ],
                "usage_guidance": [
                  "Open setup periods of the latest complete week: price-to-sales, weeks down, setup and entry lights."
                ]
              },
              {
                "id": "3b165a89cb2ebf36a12d6ec92ae4c678",
                "question": [
                  "Which members are left out today, and why?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()) SELECT c.company_name, c.gics_sector_name AS sector_name, m.exclusion_reason_code, m.price_date FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = m.company_id WHERE NOT m.is_used ORDER BY m.exclusion_reason_code, c.company_name"
                ],
                "usage_guidance": [
                  "Members that are not used, with the reason."
                ]
              },
              {
                "id": "3c4875b7bdcd03ab7f3466aa905c0e8b",
                "question": [
                  "Is the market climate red, so that short selling can run?"
                ],
                "sql": [
                  "WITH latest AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' AND signal_date <= current_date()) SELECT s.signal_date AS climate_date, max(CASE WHEN s.band_code = 'red' THEN 1 ELSE 0 END) = 1 AS is_red, concat_ws(', ', collect_list(concat(s.lens_name, ': ', s.band_code))) AS lights_text, CASE WHEN max(CASE WHEN s.band_code = 'red' THEN 1 ELSE 0 END) = 1 THEN 'Red light: the strategy can run' ELSE 'No red light: do not short' END AS gate_text, CASE WHEN max(CASE WHEN s.band_code = 'red' THEN 1 ELSE 0 END) = 1 THEN 'red' ELSE 'green' END AS gate_light FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN latest l ON s.signal_date = l.day WHERE s.monitor_code = 'market_climate' AND s.signal_code = 'climate' GROUP BY s.signal_date"
                ],
                "usage_guidance": [
                  "The lights of the latest climate day and the gate."
                ]
              },
              {
                "id": "4374e11af2c9a123bc1c1f9db146a57d",
                "question": [
                  "What is the inflation rating today?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'inflation_deflation' AND signal_code = 'rating' AND signal_date <= current_date()) SELECT s.signal_date AS rating_date, s.yes_count AS stars_on, CAST(s.measured_value AS INT) AS rating, s.action_name AS label, s.band_code AS rating_band, s.threshold_value AS cpi_change_twelve_months, s.reason_text FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'inflation_deflation' AND s.signal_code = 'rating'"
                ],
                "usage_guidance": [
                  "Rating row of the latest day: stars on, label, US consumer prices over 12 months."
                ]
              },
              {
                "id": "45fc87c90f24a85c8e172b8902140f1d",
                "question": [
                  "Which companies push the index P/E up most?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()) SELECT c.company_name, c.gics_sector_name AS sector_name, m.market_value_share_ratio, m.price_earnings_ten_year_average_inflation_adjusted_ratio AS member_pe, CASE WHEN m.earnings_trailing_twelve_months_amount > 0 THEN m.market_value_amount / m.earnings_trailing_twelve_months_amount END AS member_pe_trailing, m.price_earnings_without_member_ratio AS pe_without_member, m.price_earnings_effect_ratio AS pe_effect FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = m.company_id WHERE m.is_used AND m.price_earnings_effect_ratio IS NOT NULL ORDER BY m.price_earnings_effect_ratio DESC LIMIT 10"
                ],
                "usage_guidance": [
                  "Top 10 of the latest day."
                ]
              },
              {
                "id": "52e5451c9f5a84462871af56db57271f",
                "question": [
                  "What is the P/E of each sector, and the index P/E without it?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()), used AS (SELECT c.gics_sector_name AS sector_name, m.market_value_amount AS value, m.earnings_ten_year_average_inflation_adjusted_amount AS earnings, m.price_earnings_effect_ratio AS effect FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = m.company_id WHERE m.is_used), total AS (SELECT sum(value) AS value, sum(earnings) AS earnings FROM used) SELECT u.sector_name, count(*) AS member_count, sum(u.value) / 1e12 AS market_value_trillion, sum(u.value) / total.value AS market_value_share_ratio, CASE WHEN sum(u.earnings) > 0 THEN sum(u.value) / sum(u.earnings) END AS sector_pe, CASE WHEN total.earnings - sum(u.earnings) > 0 THEN (total.value - sum(u.value)) / (total.earnings - sum(u.earnings)) END AS pe_without_sector, total.value / total.earnings AS pe_index FROM used u CROSS JOIN total GROUP BY u.sector_name, total.value, total.earnings ORDER BY sum(u.value) DESC"
                ],
                "usage_guidance": [
                  "Sectors of the latest day."
                ]
              },
              {
                "id": "586211d38eca6dbe111eaa117564f575",
                "question": [
                  "What is the S&P 500 P/E today, on 10-year inflation-adjusted and on trailing earnings?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()) SELECT i.valuation_date, i.market_value_amount / 1e12 AS market_value_trillion, i.earnings_ten_year_average_inflation_adjusted_amount / 1e9 AS earnings_adjusted_billion, i.price_earnings_ten_year_average_inflation_adjusted_ratio AS pe_ten_year_adjusted, i.price_earnings_trailing_twelve_months_ratio AS pe_trailing, i.members_used_count, i.member_count, i.members_without_shares_count, i.members_under_ten_years_count FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index i JOIN asof a ON i.valuation_date = a.day"
                ],
                "usage_guidance": [
                  "Index row of the latest day."
                ]
              },
              {
                "id": "6c7dd273cc33b2e3a60947f3cf196f85",
                "question": [
                  "Is the bear market fund setup on, and is there an entry this week?"
                ],
                "sql": [
                  "WITH states AS ( WITH red AS ( SELECT signal_date, max(CAST(band_code = 'red' AS INT)) = 1 AS is_red FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' GROUP BY signal_date ), index_days AS ( SELECT listing_id, trading_symbol_code, price_date, price_close, ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily WHERE trading_symbol_code = '^GSPC' ), index_weeks AS ( SELECT max(listing_id) AS listing_id, max(trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', price_date) AS DATE) AS week_start, max(price_date) AS week_end_date, max_by(price_close, price_date) AS week_close, min(ingested_timestamp) AS ingested_timestamp FROM index_days GROUP BY CAST(date_trunc('WEEK', price_date) AS DATE) ), bear_weeks AS ( SELECT w.*, lag(week_close, 1) OVER (ORDER BY week_start) AS previous_close, lag(week_close, 5) OVER (ORDER BY week_start) AS five_weeks_close FROM index_weeks w ), bear_states AS ( SELECT 'bear_market_fund' AS strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, CAST(week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(five_weeks_close AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(week_close / previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, CAST(NULL AS DECIMAL(18, 4)) AS price_to_sales_ratio, CAST(NULL AS INT) AS down_week_count, r.is_red AND week_close < five_weeks_close AS is_setup_on, r.is_red, w.ingested_timestamp FROM bear_weeks w JOIN red r ON r.signal_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ), stock_weeks AS ( SELECT p.listing_id, max(p.trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', p.price_date) AS DATE) AS week_start, max_by(p.price_close_adjusted, p.price_date) AS week_close, min(p.ingested_timestamp) AS ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily p JOIN (SELECT DISTINCT listing_id FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member) m ON m.listing_id = p.listing_id WHERE p.price_date >= (SELECT date_sub(min(signal_date), 70) FROM red) GROUP BY p.listing_id, CAST(date_trunc('WEEK', p.price_date) AS DATE) ), stock_down AS ( SELECT *, coalesce(CAST(week_close < lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS INT), 0) AS is_down FROM stock_weeks ), stock_run AS ( SELECT *, sum(1 - is_down) OVER (PARTITION BY listing_id ORDER BY week_start) AS run_group FROM stock_down ), stock_streak AS ( SELECT *, sum(is_down) OVER (PARTITION BY listing_id, run_group ORDER BY week_start) AS down_weeks, lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS previous_close FROM stock_run ), short_states AS ( SELECT 'short_selling' AS strategy_code, s.trading_symbol_code, s.listing_id, s.week_start, w.week_end_date, CAST(s.week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(NULL AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(s.week_close / s.previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, m.price_to_sales_ratio, CAST(s.down_weeks AS INT) AS down_week_count, r.is_red AND m.price_to_sales_ratio > 15 AND s.down_weeks >= 3 AS is_setup_on, r.is_red, s.ingested_timestamp FROM stock_streak s JOIN index_weeks w ON w.week_start = s.week_start JOIN red r ON r.signal_date = w.week_end_date JOIN ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m ON m.listing_id = s.listing_id AND m.valuation_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ) SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM bear_states UNION ALL SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM short_states ), bear AS (SELECT * FROM states WHERE strategy_code = 'bear_market_fund' AND week_end_date <= current_date() ORDER BY week_end_date DESC LIMIT 1) SELECT week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, is_red, week_close_amount < five_weeks_close_amount AS is_lower_than_five_weeks, is_setup_on, CASE WHEN is_setup_on THEN 'GO' ELSE 'NO GO' END AS setup_text, CASE WHEN is_setup_on THEN 'green' ELSE 'red' END AS setup_light, CASE WHEN NOT is_setup_on THEN NULL WHEN week_change_ratio <= -0.05 THEN 'half_of_equity' WHEN week_change_ratio <= -0.025 THEN 'quarter_of_equity' END AS entry_band_code, CASE WHEN NOT is_setup_on THEN 'No action: the setup is off.' WHEN week_change_ratio <= -0.05 THEN 'Entry: invest half of equity in the bear fund on Monday.' WHEN week_change_ratio <= -0.025 THEN 'Entry: invest a quarter of equity in the bear fund on Monday.' WHEN week_change_ratio < 0 THEN 'No entry yet: the week fell less than 2.5%. On Monday to Wednesday a close 2.5% below this week close is an interim entry (a quarter of equity).' ELSE 'No entry: the S&P 500 did not fall this week.' END AS action_text FROM bear"
                ],
                "usage_guidance": [
                  "GO or NO GO for the latest complete week, the S&P 500 week change, the entry band and what to do."
                ]
              },
              {
                "id": "6d93eb8f69177e1eaea45d4f4ff8d12a",
                "question": [
                  "How is EQT's P/E worked out, step by step?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()), m AS (SELECT m.*, c.company_name FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = m.company_id WHERE c.company_name = 'EQT Corporation'), steps AS ( SELECT 1 AS step_number, 'Closing price' AS step_name, format_number(price_close, 2) || ' US$ on ' || CAST(price_date AS STRING) AS value_text, 'Latest close on or before the day' AS how_text FROM m UNION ALL SELECT 2, 'Shares outstanding', format_number(share_count, 0) || ' (' || coalesce(share_count_source_code, 'none') || ')', 'From the latest filing' FROM m UNION ALL SELECT 3, 'Market value', format_number(market_value_amount / 1e9, 2) || ' US$ billion', 'Step 1 x step 2' FROM m UNION ALL SELECT 4, 'Earnings, trailing 12 months', format_number(earnings_trailing_twelve_months_amount / 1e6, 1) || ' US$ million', 'Net income of the latest 12 months' FROM m UNION ALL SELECT 5, 'P/E on trailing earnings (what finance sites show)', format_number(market_value_amount / nullif(earnings_trailing_twelve_months_amount, 0), 2), 'Step 3 / step 4' FROM m UNION ALL SELECT 6, 'Earnings, average of the last ' || coalesce(CAST(earnings_year_count AS STRING), '0') || ' years', format_number(earnings_ten_year_average_amount / 1e6, 1) || ' US$ million', 'Average yearly net income, up to 10 years' FROM m UNION ALL SELECT 7, 'Inflation factor', format_number(consumer_price_index_value / nullif(filing_consumer_price_index_value, 0), 4), 'Price index today / price index at the filing' FROM m UNION ALL SELECT 8, 'Average earnings in today''s money', format_number(earnings_ten_year_average_inflation_adjusted_amount / 1e6, 1) || ' US$ million', 'Step 6 x step 7' FROM m UNION ALL SELECT 9, 'P/E on 10-year inflation-adjusted earnings (the climate uses this)', format_number(price_earnings_ten_year_average_inflation_adjusted_ratio, 2), 'Step 3 / step 8' FROM m UNION ALL SELECT 10, 'Index P/E without this member', format_number(price_earnings_without_member_ratio, 2), 'Same calculation over the other members' FROM m UNION ALL SELECT 11, 'Effect on the index P/E', format_number(price_earnings_effect_ratio, 4), 'Index P/E minus step 10' FROM m UNION ALL SELECT 12, 'Used in the index', CASE WHEN is_used THEN 'Yes' ELSE 'No: ' || exclusion_reason_code END, 'A member is left out when an input is missing' FROM m) SELECT step_number, step_name, value_text, how_text FROM steps ORDER BY step_number"
                ],
                "usage_guidance": [
                  "Replace 'EQT Corporation' with the company asked about."
                ]
              },
              {
                "id": "70367c8b4adfc02936908d33d3a550a8",
                "question": [
                  "What are EQT's last close and its 52-week high and low?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()), listing AS (SELECT m.listing_id FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = m.company_id WHERE c.company_name = 'EQT Corporation'), priced AS (SELECT p.price_date, p.price_close, i.price_high_fifty_two_week_amount AS high_52_weeks, i.price_low_fifty_two_week_amount AS low_52_weeks, lag(p.price_close) OVER (ORDER BY p.price_date) AS previous_close FROM ${var.catalog}.silver_domain_investments.price_daily p JOIN ${var.catalog}.silver_domain_investments.price_indicator_daily i ON i.listing_id = p.listing_id AND i.price_date = p.price_date JOIN listing l ON l.listing_id = p.listing_id WHERE p.price_date <= (SELECT day FROM asof)) SELECT price_close AS last_close, price_close / previous_close - 1 AS day_change_ratio, high_52_weeks, low_52_weeks, price_date FROM priced ORDER BY price_date DESC LIMIT 1"
                ],
                "usage_guidance": [
                  "Replace 'EQT Corporation' with the company asked about."
                ]
              },
              {
                "id": "7848af70236aeaec281231f189c246b3",
                "question": [
                  "What are the short-term interest rates and 10-year yields of the main countries?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'currency' AND signal_code = 'summary' AND signal_date <= current_date()), countries AS (SELECT * FROM VALUES ('USD', 'US dollar', 'us_federal_funds_effective_rate', 'us_10_year_treasury_yield'), ('EUR', 'Euro', 'euro_area_deposit_facility_rate', 'euro_area_10_year_government_bond_yield'), ('JPY', 'Japanese yen', 'japan_3_month_interbank_rate', 'japan_10_year_government_bond_yield'), ('GBP', 'British pound', 'uk_call_money_rate', 'uk_10_year_government_bond_yield'), ('CHF', 'Swiss franc', 'switzerland_3_month_interbank_rate', 'switzerland_10_year_government_bond_yield'), ('CAD', 'Canadian dollar', 'canada_3_month_interbank_rate', 'canada_10_year_government_bond_yield'), ('SEK', 'Swedish krona', 'sweden_3_month_interbank_rate', 'sweden_10_year_government_bond_yield'), ('AUD', 'Australian dollar', 'rba_cash_rate_target', 'australia_10_year_government_bond_yield'), ('NZD', 'New Zealand dollar', 'new_zealand_3_month_interbank_rate', 'new_zealand_10_year_government_bond_yield'), ('CNY', 'Chinese yuan', 'china_3_month_interbank_rate', '-') AS countries(currency_code, currency_name, short_rate_code, long_rate_code)), latest AS (SELECT i.rate_code, i.rate_value, i.observation_date FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily i JOIN asof a ON i.indicator_date = a.day) SELECT c.currency_name AS country_currency, s.rate_value AS short_term_rate, s.observation_date AS short_term_date, CASE WHEN s.observation_date < add_months(a.day, -4) THEN 'Older than 4 months' END AS short_term_note, l.rate_value AS ten_year_yield, l.observation_date AS ten_year_date, CASE WHEN c.long_rate_code = '-' THEN 'Not available' WHEN l.observation_date < add_months(a.day, -4) THEN 'Older than 4 months' END AS ten_year_note FROM countries c CROSS JOIN asof a LEFT JOIN latest s ON s.rate_code = c.short_rate_code LEFT JOIN latest l ON l.rate_code = c.long_rate_code"
                ],
                "usage_guidance": [
                  "Each reading with its date; a note says when a reading is older than 4 months."
                ]
              },
              {
                "id": "835ac8af518fd9aab33915cce2f4f45e",
                "question": [
                  "What are the latest short selling events?"
                ],
                "sql": [
                  "SELECT e.event_date, e.trading_symbol_code, e.event_name, e.setup_start_date, e.entry_number, e.price_to_sales_ratio, e.down_week_count, e.reason_text FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event e WHERE e.strategy_code = 'short_selling' AND e.event_date <= current_date() ORDER BY e.event_date DESC, e.trading_symbol_code LIMIT 40"
                ],
                "usage_guidance": [
                  "The 40 latest setup starts, entries and setup ends."
                ]
              },
              {
                "id": "85d3225ee7b2528a38bcd7812df0686a",
                "question": [
                  "How has the bear fund SQQQ moved against the S&P 500, and when was the setup on?"
                ],
                "sql": [
                  "WITH fund AS (SELECT price_date, price_close FROM ${var.catalog}.silver_domain_investments.price_daily WHERE trading_symbol_code = 'SQQQ' AND price_date >= add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END))), sp500 AS (SELECT price_date, price_close AS sp500_close FROM ${var.catalog}.silver_domain_investments.price_daily WHERE trading_symbol_code = '^GSPC' AND price_date >= add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END))), periods AS (SELECT setup_start_date AS start_date, min(CASE WHEN event_code = 'setup_end' THEN event_date END) AS end_date FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'bear_market_fund' GROUP BY setup_start_date), entries AS (SELECT event_date, entry_band_code FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'bear_market_fund' AND event_code = 'entry') SELECT f.price_date, f.price_close AS fund_close, s.sp500_close, p.start_date IS NOT NULL AS is_in_setup, e.entry_band_code, add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END)) AS range_start_date, current_date() AS range_end_date FROM fund f JOIN sp500 s ON s.price_date = f.price_date LEFT JOIN periods p ON f.price_date >= p.start_date AND f.price_date < coalesce(p.end_date, DATE '9999-12-31') LEFT JOIN entries e ON e.event_date = f.price_date ORDER BY f.price_date"
                ],
                "usage_guidance": [
                  "Daily fund close, S&P 500 close, whether the day is in a setup period and the entry days; replace 'SQQQ' with another bear fund."
                ]
              },
              {
                "id": "8971f94739ab6aed577781846d613e55",
                "question": [
                  "What is the real interest rate over time?"
                ],
                "sql": [
                  "SELECT indicator_date, rate_value, two_hundred_day_average_value AS average_200 FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily WHERE rate_code = 'us_real_federal_funds_rate' AND indicator_date >= add_months(date_trunc('MONTH', current_date()), -35) ORDER BY indicator_date"
                ],
                "usage_guidance": [
                  "Effective rate minus the US consumer price change over 12 months, last 36 months."
                ]
              },
              {
                "id": "946bbd0214a38d5f0cde278e70ecb41a",
                "question": [
                  "Is the dollar strong or weak today?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'currency' AND signal_code = 'summary' AND signal_date <= current_date()) SELECT s.signal_date, s.signal_code, s.signal_name, CASE WHEN s.is_yes THEN 'Strong' ELSE 'Weak' END AS dollar_state, s.band_code AS dollar_band, CASE s.signal_code WHEN 'dollar_index' THEN 1 ELSE 2 END AS index_order, s.measured_value AS index_level, s.threshold_value AS average_200, s.reason_text FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'currency' AND s.signal_code IN ('dollar_index', 'dollar_broad_index') ORDER BY index_order"
                ],
                "usage_guidance": [
                  "The US Dollar Index (megatrend) and the Federal Reserve broad dollar index against their 200-day averages."
                ]
              },
              {
                "id": "99c9f223adabe530b71a75484d424d85",
                "question": [
                  "Which inflation stars are on today, and why?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'inflation_deflation' AND signal_code = 'rating' AND signal_date <= current_date()) SELECT s.signal_name, s.signal_code, CASE s.signal_code WHEN 'commodity_prices' THEN 1 WHEN 'consumer_prices' THEN 2 WHEN 'gold_prices' THEN 3 ELSE 4 END AS star_order, CASE WHEN s.is_yes THEN 'On' ELSE 'Off' END AS star_state, s.band_code AS star_band, s.measured_value, s.threshold_value, s.reason_text FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'inflation_deflation' AND s.signal_code <> 'rating' ORDER BY star_order"
                ],
                "usage_guidance": [
                  "One row per vehicle; On means it points to inflation."
                ]
              },
              {
                "id": "aaadc45a93b9c13f050fe88fff899a2d",
                "question": [
                  "How have US consumer prices changed over 12 months?"
                ],
                "sql": [
                  "SELECT indicator_date, rate_value AS cpi_change, CASE rate_code WHEN 'us_cpi_change_twelve_months_percent' THEN 'Over 12 months' ELSE 'Against the previous reading' END AS change_label FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily WHERE rate_code IN ('us_cpi_change_twelve_months_percent', 'us_cpi_change_previous_reading_percent') AND indicator_date >= add_months(date_trunc('MONTH', current_date()), -35) ORDER BY indicator_date"
                ],
                "usage_guidance": [
                  "The 12-month change and the change against the previous reading, last 36 months."
                ]
              },
              {
                "id": "abf22b981abb8deece75a3e3cc89b8eb",
                "question": [
                  "Which country can deliver the highest yield, considering its interest rate and its currency's change, in a table ranking?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'currency' AND signal_code = 'summary' AND signal_date <= current_date()), countries AS (SELECT * FROM VALUES ('USD', 'US dollar', 'us_federal_funds_effective_rate', 'us_10_year_treasury_yield'), ('EUR', 'Euro', 'euro_area_deposit_facility_rate', 'euro_area_10_year_government_bond_yield'), ('JPY', 'Japanese yen', 'japan_3_month_interbank_rate', 'japan_10_year_government_bond_yield'), ('GBP', 'British pound', 'uk_call_money_rate', 'uk_10_year_government_bond_yield'), ('CHF', 'Swiss franc', 'switzerland_3_month_interbank_rate', 'switzerland_10_year_government_bond_yield'), ('CAD', 'Canadian dollar', 'canada_3_month_interbank_rate', 'canada_10_year_government_bond_yield'), ('SEK', 'Swedish krona', 'sweden_3_month_interbank_rate', 'sweden_10_year_government_bond_yield'), ('AUD', 'Australian dollar', 'rba_cash_rate_target', 'australia_10_year_government_bond_yield'), ('NZD', 'New Zealand dollar', 'new_zealand_3_month_interbank_rate', 'new_zealand_10_year_government_bond_yield'), ('CNY', 'Chinese yuan', 'china_3_month_interbank_rate', '-') AS countries(currency_code, currency_name, short_rate_code, long_rate_code)), series_values AS (SELECT rate_code, indicator_date, rate_value, two_hundred_day_average_value AS average_value, lag(rate_value, 252) OVER (PARTITION BY rate_code ORDER BY indicator_date) AS year_ago FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily WHERE rate_code LIKE concat('currency_value_%_in_', lower('AUD'))), today AS (SELECT v.* FROM series_values v JOIN asof a ON v.indicator_date = a.day), latest AS (SELECT i.rate_code, i.rate_value, i.observation_date FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily i JOIN asof a ON i.indicator_date = a.day), ranked AS ( SELECT c.currency_code, c.currency_name, s.rate_value AS short_term_rate, s.observation_date AS short_term_date, l.rate_value AS ten_year_yield, CASE WHEN c.currency_code = upper('AUD') THEN 0 ELSE (t.rate_value / t.year_ago - 1) * 100 END AS currency_change_12m, CASE WHEN c.currency_code = upper('AUD') THEN 0 ELSE (t.rate_value / t.average_value - 1) * 100 END AS distance_from_average FROM countries c LEFT JOIN latest s ON s.rate_code = c.short_rate_code LEFT JOIN latest l ON l.rate_code = c.long_rate_code LEFT JOIN today t ON t.rate_code = concat('currency_value_', lower(c.currency_code), '_in_', lower('AUD')) WHERE s.rate_value IS NOT NULL AND (c.currency_code = upper('AUD') OR t.year_ago IS NOT NULL)) SELECT rank() OVER (ORDER BY short_term_rate + currency_change_12m DESC) AS rank_position, currency_name, round(short_term_rate, 2) AS short_term_rate, short_term_date, round(ten_year_yield, 2) AS ten_year_yield, round(currency_change_12m, 1) AS currency_change_12m, round(distance_from_average, 1) AS distance_from_average, round(short_term_rate + currency_change_12m, 1) AS short_plus_12m FROM ranked ORDER BY rank_position"
                ],
                "usage_guidance": [
                  "Short-term rate plus the 12-month change of the currency against the base; replace 'AUD' with 'USD' for a US dollar base. Backward-looking."
                ]
              },
              {
                "id": "bba3ddf92c7dec313dc4d1688f4fef0a",
                "question": [
                  "How has the inflation rating changed over time?"
                ],
                "sql": [
                  "SELECT signal_date, yes_count AS stars_on, CAST(measured_value AS INT) AS rating, action_name AS label FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'inflation_deflation' AND signal_code = 'rating' AND signal_date >= add_months(date_trunc('MONTH', current_date()), -35) ORDER BY signal_date"
                ],
                "usage_guidance": [
                  "Rating per day, last 36 months."
                ]
              },
              {
                "id": "bdf8a132abf205b7d6824133387dec6a",
                "question": [
                  "How has the Swiss franc moved against the US and Australian dollars?"
                ],
                "sql": [
                  "SELECT indicator_date, max(CASE WHEN rate_code = concat('currency_value_', lower('CHF'), '_in_usd') THEN rate_value END) AS value_in_usd, max(CASE WHEN rate_code = concat('currency_value_', lower('CHF'), '_in_usd') THEN two_hundred_day_average_value END) AS average_in_usd, max(CASE WHEN rate_code = concat('currency_value_', lower('CHF'), '_in_aud') THEN rate_value END) AS value_in_aud, max(CASE WHEN rate_code = concat('currency_value_', lower('CHF'), '_in_aud') THEN two_hundred_day_average_value END) AS average_in_aud FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily WHERE rate_code IN (concat('currency_value_', lower('CHF'), '_in_usd'), concat('currency_value_', lower('CHF'), '_in_aud')) AND indicator_date >= add_months(date_trunc('MONTH', current_date()), -35) GROUP BY indicator_date ORDER BY indicator_date"
                ],
                "usage_guidance": [
                  "Replace 'CHF' with the currency code asked about (USD, EUR, JPY, GBP, CHF, CAD, SEK, AUD, NZD, CNY)."
                ]
              },
              {
                "id": "c134332a69b3c8798fa6abb0e7efa749",
                "question": [
                  "How have the lights changed over time?"
                ],
                "sql": [
                  "SELECT signal_date, lens_name, lens_code, yes_count, band_code AS light_code, add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END)) AS range_start_date, current_date() AS range_end_date FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' AND signal_date >= add_months(current_date(), -(CASE '36M' WHEN '1M' THEN 1 WHEN '3M' THEN 3 WHEN '6M' THEN 6 WHEN '12M' THEN 12 WHEN '24M' THEN 24 WHEN '36M' THEN 36 ELSE 36 END)) ORDER BY signal_date, lens_name"
                ],
                "usage_guidance": [
                  "Yes answers per day for each climate, last 36 months."
                ]
              },
              {
                "id": "c15dcc0ac29ec07ba36de63032435aaa",
                "question": [
                  "What happened in the bear market fund setup periods?"
                ],
                "sql": [
                  "SELECT event_date, event_name, setup_start_date, entry_number, entry_band_code, week_close_amount, five_weeks_close_amount, week_change_ratio, reason_text FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'bear_market_fund' AND ('all' = 'all' OR CAST(setup_start_date AS STRING) = 'all') ORDER BY event_date DESC"
                ],
                "usage_guidance": [
                  "Events of every setup period; replace 'all' with a setup start date to see one period."
                ]
              },
              {
                "id": "c7e4228464e41fd6693920e892392b12",
                "question": [
                  "How have the dollar indexes moved over time?"
                ],
                "sql": [
                  "SELECT b.indicator_date, d.price_close_adjusted AS dxy_close, d.close_adjusted_two_hundred_day_average_amount AS dxy_average, b.rate_value AS broad_value, b.two_hundred_day_average_value AS broad_average FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily b LEFT JOIN ${var.catalog}.silver_domain_investments.price_indicator_daily d ON d.trading_symbol_code = 'DX-Y.NYB' AND d.price_date = b.indicator_date WHERE b.rate_code = 'us_dollar_broad_index' AND b.indicator_date >= add_months(date_trunc('MONTH', current_date()), -35) ORDER BY b.indicator_date"
                ],
                "usage_guidance": [
                  "Both indexes and their 200-day averages, last 36 months."
                ]
              },
              {
                "id": "d39e89da306a89d09f1608158100d890",
                "question": [
                  "What is the market climate today?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' AND signal_date <= current_date()) SELECT s.lens_name, s.lens_code, s.yes_count, s.band_code AS light_code, s.action_name, s.reason_text, s.signal_date AS climate_date FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'market_climate' AND s.signal_code = 'climate' ORDER BY s.lens_code"
                ],
                "usage_guidance": [
                  "Both lights with the yes count and the climate date."
                ]
              },
              {
                "id": "d85a21ffa8adda3ba1890618f90c02ca",
                "question": [
                  "What are the three answers of each climate today, and why?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' AND signal_date <= current_date()) SELECT s.lens_name, s.lens_code, s.signal_name, s.signal_code, CASE WHEN s.is_yes THEN 'Yes' ELSE 'No' END AS answer_text, s.band_code, s.measured_value, s.threshold_value, s.reason_text FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'market_climate' AND s.signal_code <> 'climate' ORDER BY s.lens_code, s.signal_code"
                ],
                "usage_guidance": [
                  "One row per climate and question."
                ]
              },
              {
                "id": "de05b11b46deb2f206afe853fb716e38",
                "question": [
                  "How are the bear funds doing?"
                ],
                "sql": [
                  "WITH funds AS (SELECT * FROM VALUES ('SQQQ', 'ProShares UltraPro Short QQQ', '3x short Nasdaq-100', 1), ('PSQ', 'ProShares Short QQQ', '1x short Nasdaq-100', 2), ('SH', 'ProShares Short S&P500', '1x short S&P 500', 3), ('SDS', 'ProShares UltraShort S&P500', '2x short S&P 500', 4), ('SPXU', 'ProShares UltraPro Short S&P500', '3x short S&P 500', 5) AS funds(fund_code, fund_name, fund_description, fund_order)), prices AS (SELECT p.trading_symbol_code AS fund_code, p.price_date, p.price_close, row_number() OVER (PARTITION BY p.trading_symbol_code ORDER BY p.price_date DESC) AS recency FROM ${var.catalog}.silver_domain_investments.price_daily p JOIN funds f ON f.fund_code = p.trading_symbol_code WHERE p.price_date <= current_date()) SELECT f.fund_code, f.fund_name, f.fund_description, f.fund_order, max(CASE WHEN p.recency = 1 THEN p.price_date END) AS last_date, max(CASE WHEN p.recency = 1 THEN p.price_close END) AS last_close, max(CASE WHEN p.recency = 1 THEN p.price_close END) / max(CASE WHEN p.recency = 6 THEN p.price_close END) - 1 AS week_change_ratio FROM funds f LEFT JOIN prices p ON p.fund_code = f.fund_code AND p.recency <= 6 GROUP BY f.fund_code, f.fund_name, f.fund_description, f.fund_order ORDER BY f.fund_order"
                ],
                "usage_guidance": [
                  "SQQQ, PSQ, SH, SDS and SPXU: last close and the change over 5 trading days."
                ]
              },
              {
                "id": "df1621fab1176953df2892dd0342ae21",
                "question": [
                  "What is the short-term interest rate and its 200-day average?"
                ],
                "sql": [
                  "SELECT indicator_date, rate_value, two_hundred_day_average_value AS average_200 FROM ${var.catalog}.silver_domain_investments.market_rate_indicator_daily WHERE rate_code = 'us_federal_funds_effective_rate' AND indicator_date >= add_months(date_trunc('MONTH', current_date()), -35) ORDER BY indicator_date"
                ],
                "usage_guidance": [
                  "Federal funds effective rate, last 36 months."
                ]
              },
              {
                "id": "e93e90997545471d0e255cf6e3845f61",
                "question": [
                  "How do the commodity benchmarks compare with their 200-day averages today?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'inflation_deflation' AND signal_code = 'rating' AND signal_date <= current_date()), names AS (SELECT * FROM VALUES ('^TRCCRB', 'CRB commodity index (votes)', 1), ('^SPGSCI', 'S&P GSCI commodity index', 2), ('GC=F', 'Gold futures (votes as gold)', 3), ('SI=F', 'Silver futures', 4), ('HG=F', 'Copper futures', 5), ('CL=F', 'WTI crude oil futures', 6), ('DBC', 'Invesco DB Commodity fund', 7), ('GSG', 'iShares S&P GSCI fund', 8) AS names(symbol, benchmark_name, benchmark_order)) , latest AS (SELECT p.*, row_number() OVER (PARTITION BY p.trading_symbol_code ORDER BY p.price_date DESC) AS pick FROM ${var.catalog}.silver_domain_investments.price_indicator_daily p JOIN asof a ON p.price_date <= a.day AND p.price_date >= date_sub(a.day, 7) WHERE p.trading_symbol_code IN (SELECT symbol FROM names)) SELECT n.benchmark_name, n.symbol, l.price_date, l.price_close_adjusted AS price_close, l.close_adjusted_two_hundred_day_average_amount AS average_200, l.price_close_adjusted / l.close_adjusted_two_hundred_day_average_amount - 1 AS distance_ratio, l.close_adjusted_two_hundred_day_average_slope_ratio AS slope_ratio, CASE WHEN l.price_close_adjusted > l.close_adjusted_two_hundred_day_average_amount THEN 'Above' ELSE 'Below' END AS position_text, CASE WHEN l.close_adjusted_two_hundred_day_average_slope_ratio > 0 THEN 'Rising' ELSE 'Falling' END AS direction_text, n.symbol = '^TRCCRB' AS is_vote FROM names n LEFT JOIN latest l ON l.trading_symbol_code = n.symbol AND l.pick = 1 ORDER BY n.benchmark_order"
                ],
                "usage_guidance": [
                  "Eight benchmarks; only the CRB index and gold vote."
                ]
              },
              {
                "id": "e946b2dbf12be9d9f7ee89f7f3141059",
                "question": [
                  "Do the member rows add up to the index row?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()), sums AS (SELECT count_if(m.is_used) AS used_count, sum(CASE WHEN m.is_used THEN m.market_value_amount END) AS value, sum(CASE WHEN m.is_used THEN m.earnings_ten_year_average_inflation_adjusted_amount END) AS earnings FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day) SELECT i.members_used_count AS index_used_count, s.used_count AS member_used_count, round(i.market_value_amount - s.value, 2) AS market_value_difference_amount, round(i.earnings_ten_year_average_inflation_adjusted_amount - s.earnings, 2) AS earnings_difference_amount, i.price_earnings_ten_year_average_inflation_adjusted_ratio AS pe_index, round(s.value / s.earnings, 4) AS pe_from_members FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index i JOIN asof a ON i.valuation_date = a.day CROSS JOIN sums s"
                ],
                "usage_guidance": [
                  "Differences should be 0."
                ]
              },
              {
                "id": "f5b5d6ad5fcc763290f526719fd359cd",
                "question": [
                  "Which companies push the index P/E down most?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(valuation_date) AS day FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index WHERE valuation_date <= current_date()) SELECT c.company_name, c.gics_sector_name AS sector_name, m.market_value_share_ratio, m.price_earnings_ten_year_average_inflation_adjusted_ratio AS member_pe, CASE WHEN m.earnings_trailing_twelve_months_amount > 0 THEN m.market_value_amount / m.earnings_trailing_twelve_months_amount END AS member_pe_trailing, m.price_earnings_without_member_ratio AS pe_without_member, m.price_earnings_effect_ratio AS pe_effect FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m JOIN asof a ON m.valuation_date = a.day JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = m.company_id WHERE m.is_used AND m.price_earnings_effect_ratio IS NOT NULL ORDER BY m.price_earnings_effect_ratio ASC LIMIT 10"
                ],
                "usage_guidance": [
                  "Top 10 of the latest day."
                ]
              },
              {
                "id": "f9aae093a1855d15936f448a5bb31844",
                "question": [
                  "Which currencies are gaining or losing against the US dollar and the Australian dollar today?"
                ],
                "sql": [
                  "WITH asof AS (SELECT max(signal_date) AS day FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'currency' AND signal_code = 'summary' AND signal_date <= current_date()), names AS (SELECT * FROM VALUES ('USD', 'US dollar', 1), ('EUR', 'Euro', 2), ('JPY', 'Japanese yen', 3), ('GBP', 'British pound', 4), ('CHF', 'Swiss franc', 5), ('CAD', 'Canadian dollar', 6), ('SEK', 'Swedish krona', 7), ('AUD', 'Australian dollar', 8), ('NZD', 'New Zealand dollar', 9), ('CNY', 'Chinese yuan', 10) AS names(currency_code, currency_name, currency_order)), against_usd AS (SELECT upper(s.signal_code) AS currency_code, s.is_yes, s.band_code, s.measured_value, s.threshold_value FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'currency' AND s.lens_code = 'us_dollar' AND signal_code NOT IN ('summary', 'dollar_index', 'dollar_broad_index')), against_aud AS (SELECT upper(s.signal_code) AS currency_code, s.is_yes, s.band_code, s.measured_value, s.threshold_value FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal s JOIN asof a ON s.signal_date = a.day WHERE s.monitor_code = 'currency' AND s.lens_code = 'australian_dollar' AND signal_code NOT IN ('summary', 'dollar_index', 'dollar_broad_index')) SELECT n.currency_code, n.currency_name, u.measured_value AS value_in_usd, u.measured_value / u.threshold_value - 1 AS distance_usd, CASE u.is_yes WHEN true THEN 'Gaining' WHEN false THEN 'Losing' ELSE 'Base' END AS against_usd, coalesce(u.band_code, 'blue') AS band_usd, a.measured_value AS value_in_aud, a.measured_value / a.threshold_value - 1 AS distance_aud, CASE a.is_yes WHEN true THEN 'Gaining' WHEN false THEN 'Losing' ELSE 'Base' END AS against_aud, coalesce(a.band_code, 'blue') AS band_aud FROM names n LEFT JOIN against_usd u ON u.currency_code = n.currency_code LEFT JOIN against_aud a ON a.currency_code = n.currency_code ORDER BY n.currency_order"
                ],
                "usage_guidance": [
                  "One row per currency; value, distance from the 200-day average and Gaining or Losing against each base."
                ]
              },
              {
                "id": "fce5fc081fc53f1133f2c4a28bbb744c",
                "question": [
                  "What are the checks behind the bear market fund setup, entry and exit?"
                ],
                "sql": [
                  "WITH states AS ( WITH red AS ( SELECT signal_date, max(CAST(band_code = 'red' AS INT)) = 1 AS is_red FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' GROUP BY signal_date ), index_days AS ( SELECT listing_id, trading_symbol_code, price_date, price_close, ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily WHERE trading_symbol_code = '^GSPC' ), index_weeks AS ( SELECT max(listing_id) AS listing_id, max(trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', price_date) AS DATE) AS week_start, max(price_date) AS week_end_date, max_by(price_close, price_date) AS week_close, min(ingested_timestamp) AS ingested_timestamp FROM index_days GROUP BY CAST(date_trunc('WEEK', price_date) AS DATE) ), bear_weeks AS ( SELECT w.*, lag(week_close, 1) OVER (ORDER BY week_start) AS previous_close, lag(week_close, 5) OVER (ORDER BY week_start) AS five_weeks_close FROM index_weeks w ), bear_states AS ( SELECT 'bear_market_fund' AS strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, CAST(week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(five_weeks_close AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(week_close / previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, CAST(NULL AS DECIMAL(18, 4)) AS price_to_sales_ratio, CAST(NULL AS INT) AS down_week_count, r.is_red AND week_close < five_weeks_close AS is_setup_on, r.is_red, w.ingested_timestamp FROM bear_weeks w JOIN red r ON r.signal_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ), stock_weeks AS ( SELECT p.listing_id, max(p.trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', p.price_date) AS DATE) AS week_start, max_by(p.price_close_adjusted, p.price_date) AS week_close, min(p.ingested_timestamp) AS ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily p JOIN (SELECT DISTINCT listing_id FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member) m ON m.listing_id = p.listing_id WHERE p.price_date >= (SELECT date_sub(min(signal_date), 70) FROM red) GROUP BY p.listing_id, CAST(date_trunc('WEEK', p.price_date) AS DATE) ), stock_down AS ( SELECT *, coalesce(CAST(week_close < lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS INT), 0) AS is_down FROM stock_weeks ), stock_run AS ( SELECT *, sum(1 - is_down) OVER (PARTITION BY listing_id ORDER BY week_start) AS run_group FROM stock_down ), stock_streak AS ( SELECT *, sum(is_down) OVER (PARTITION BY listing_id, run_group ORDER BY week_start) AS down_weeks, lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS previous_close FROM stock_run ), short_states AS ( SELECT 'short_selling' AS strategy_code, s.trading_symbol_code, s.listing_id, s.week_start, w.week_end_date, CAST(s.week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(NULL AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(s.week_close / s.previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, m.price_to_sales_ratio, CAST(s.down_weeks AS INT) AS down_week_count, r.is_red AND m.price_to_sales_ratio > 15 AND s.down_weeks >= 3 AS is_setup_on, r.is_red, s.ingested_timestamp FROM stock_streak s JOIN index_weeks w ON w.week_start = s.week_start JOIN red r ON r.signal_date = w.week_end_date JOIN ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m ON m.listing_id = s.listing_id AND m.valuation_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ) SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM bear_states UNION ALL SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, w