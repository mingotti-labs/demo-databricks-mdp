                      "SELECT trading_symbol_code FROM (WITH states AS ( WITH red AS ( SELECT signal_date, max(CAST(band_code = 'red' AS INT)) = 1 AS is_red FROM ${var.catalog}.gold_analytics_gateway.monitor_daily_signal WHERE monitor_code = 'market_climate' AND signal_code = 'climate' GROUP BY signal_date ), index_days AS ( SELECT listing_id, trading_symbol_code, price_date, price_close, ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily WHERE trading_symbol_code = '^GSPC' ), index_weeks AS ( SELECT max(listing_id) AS listing_id, max(trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', price_date) AS DATE) AS week_start, max(price_date) AS week_end_date, max_by(price_close, price_date) AS week_close, min(ingested_timestamp) AS ingested_timestamp FROM index_days GROUP BY CAST(date_trunc('WEEK', price_date) AS DATE) ), bear_weeks AS ( SELECT w.*, lag(week_close, 1) OVER (ORDER BY week_start) AS previous_close, lag(week_close, 5) OVER (ORDER BY week_start) AS five_weeks_close FROM index_weeks w ), bear_states AS ( SELECT 'bear_market_fund' AS strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, CAST(week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(five_weeks_close AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(week_close / previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, CAST(NULL AS DECIMAL(18, 4)) AS price_to_sales_ratio, CAST(NULL AS INT) AS down_week_count, r.is_red AND week_close < five_weeks_close AS is_setup_on, r.is_red, w.ingested_timestamp FROM bear_weeks w JOIN red r ON r.signal_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ), stock_weeks AS ( SELECT p.listing_id, max(p.trading_symbol_code) AS trading_symbol_code, CAST(date_trunc('WEEK', p.price_date) AS DATE) AS week_start, max_by(p.price_close_adjusted, p.price_date) AS week_close, min(p.ingested_timestamp) AS ingested_timestamp FROM ${var.catalog}.silver_domain_investments.price_daily p JOIN (SELECT DISTINCT listing_id FROM ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member) m ON m.listing_id = p.listing_id WHERE p.price_date >= (SELECT date_sub(min(signal_date), 70) FROM red) GROUP BY p.listing_id, CAST(date_trunc('WEEK', p.price_date) AS DATE) ), stock_down AS ( SELECT *, coalesce(CAST(week_close < lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS INT), 0) AS is_down FROM stock_weeks ), stock_run AS ( SELECT *, sum(1 - is_down) OVER (PARTITION BY listing_id ORDER BY week_start) AS run_group FROM stock_down ), stock_streak AS ( SELECT *, sum(is_down) OVER (PARTITION BY listing_id, run_group ORDER BY week_start) AS down_weeks, lag(week_close) OVER (PARTITION BY listing_id ORDER BY week_start) AS previous_close FROM stock_run ), short_states AS ( SELECT 'short_selling' AS strategy_code, s.trading_symbol_code, s.listing_id, s.week_start, w.week_end_date, CAST(s.week_close AS DECIMAL(18, 6)) AS week_close_amount, CAST(NULL AS DECIMAL(18, 6)) AS five_weeks_close_amount, CAST(s.week_close / s.previous_close - 1 AS DECIMAL(18, 10)) AS week_change_ratio, m.price_to_sales_ratio, CAST(s.down_weeks AS INT) AS down_week_count, r.is_red AND m.price_to_sales_ratio > 15 AND s.down_weeks >= 3 AS is_setup_on, r.is_red, s.ingested_timestamp FROM stock_streak s JOIN index_weeks w ON w.week_start = s.week_start JOIN red r ON r.signal_date = w.week_end_date JOIN ${var.catalog}.gold_analytics_gateway.valuation_daily_index_member m ON m.listing_id = s.listing_id AND m.valuation_date = w.week_end_date WHERE (w.week_end_date = date_add(w.week_start, 4) OR current_date() > date_add(w.week_start, 4)) ) SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM bear_states UNION ALL SELECT strategy_code, trading_symbol_code, listing_id, week_start, week_end_date, week_close_amount, five_weeks_close_amount, week_change_ratio, price_to_sales_ratio, down_week_count, is_setup_on, is_red, ingested_timestamp FROM short_states ), short_week AS (SELECT max(week_end_date) AS day FROM states WHERE strategy_code = 'short_selling' AND week_end_date <= current_date()), short AS (SELECT * FROM states WHERE strategy_code = 'short_selling' AND week_end_date = (SELECT day FROM short_week)), starts AS (SELECT trading_symbol_code, max(setup_start_date) AS setup_start_date FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'short_selling' AND event_code = 'setup_start' AND event_date <= (SELECT day FROM short_week) GROUP BY trading_symbol_code), entries AS (SELECT trading_symbol_code, setup_start_date, count(*) AS entry_count FROM ${var.catalog}.gold_analytics_gateway.strategy_daily_event WHERE strategy_code = 'short_selling' AND event_code = 'entry' AND event_date <= (SELECT day FROM short_week) GROUP BY trading_symbol_code, setup_start_date) SELECT s.trading_symbol_code, c.company_name, st.setup_start_date, s.week_end_date, s.price_to_sales_ratio, s.down_week_count, s.week_change_ratio, 'green' AS setup_light, CASE WHEN coalesce(e.entry_count, 0) > 0 THEN 'green' ELSE 'grey' END AS entry_light FROM short s JOIN starts st ON st.trading_symbol_code = s.trading_symbol_code LEFT JOIN entries e ON e.trading_symbol_code = s.trading_symbol_code AND e.setup_start_date = st.setup_start_date LEFT JOIN ${var.catalog}.silver_domain_investments.listing l ON l.listing_id = s.listing_id LEFT JOIN ${var.catalog}.silver_domain_investments.company c ON c.company_id = l.company_id WHERE s.is_setup_on ORDER BY s.down_week_count DESC, s.price_to_sales_ratio DESC) ORDER BY trading_symbol_code"
                    ]
                  }
                ]
              },
